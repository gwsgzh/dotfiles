# https://organize.readthedocs.io
# looks in:
#   ~/Downloads 
#   ~/Downloads/twitter_media_harvest
#   ~/Desktop


messy_folders: &all 
  - ~/Desktop
  - ~/Downloads
  - ~/Downloads/twitter_media_harvest

rules:
  - name: Images
    locations: *all
    filter_mode: any
    filters:
      - mimetype: image
      - extension:
          - jpeg
          - jpg
          - webp
    actions:
      - move: ~/syncbox/media/TBS/IMGS

  - name: Vids 
    locations: *all
    filters:
      - mimetype: video
    actions:
      - move: ~/syncbox/media/TBS/VIDS

  - name: Docs
    locations: *all
    filter_mode: any
    filters:
      - mimetype: text
      - extension:
          - pdf
          - doc
          - docx
          - xls
          - xlsx
          - ppt
          - pptx
          - odt
          - ods
          - odp
          - txt
          - md
          - csv
          - rtf
          - epub
          - pages
          - numbers
          - key
    actions:
      - move: ~/TBS/DOCS
